# docker compose up --build
# Levanta MongoDB y el API. Copia .env.example a .env antes (JWT_SECRET, ADMIN_PASSWORD...).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tandem-datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017   # dentro de Docker el host se llama "mongo"
      MONGODB_DB: ${MONGODB_DB:-tandem}
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-desarrollo}
      JWT_EXPIRA: ${JWT_EXPIRA:-2h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tandem.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}

volumes:
  tandem-datos:
